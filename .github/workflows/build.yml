name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # 版本号标记
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  meta:
    name: Gather Meta Information
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      prerelease: ${{ steps.set_pre.outputs.prerelease }}
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag="${{ github.ref_name }}"
          else
            tag=$(git describe --tags --match "v*" HEAD 2>/dev/null || echo "v0.0.1-$(git rev-parse --short HEAD)")
          fi
          echo "tag=${tag}" | tee -a $GITHUB_OUTPUT

      - name: Check if it is a pre-release
        id: set_pre
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ '${{ steps.set_tag.outputs.tag }}' =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" | tee -a $GITHUB_OUTPUT
          else
            echo "prerelease=true" | tee -a $GITHUB_OUTPUT
          fi

      - name: Generate Changelog
        id: generate_changelog
        run: |
          echo "=== Generating Changelog ==="
          cat > bilingual_changelog.py <<'PY'
          import re
          import sys
          import os

          PREFIX_MAP = {
              "feat": "功能/feat",
              "fix": "修复/fix",
              "docs": "文档/docs",
              "style": "样式/style",
              "refactor": "重构/refactor",
              "perf": "性能/perf",
              "test": "测试/test",
              "build": "构建/build",
              "ci": "持续集成/ci",
              "chore": "维护/chore",
              "revert": "回滚/revert",
          }

          def format_commit(line):
              if not line:
                  return ""
              parts = line.split(" ", 1)
              if len(parts) != 2:
                  return line
              commit_hash, message = parts
              
              # Match conventional commit format
              match = re.match(r"^([a-zA-Z]+)(\(.+?\))?:\s*(.+)$", message)
              if match:
                  prefix = match.group(1).lower()
                  scope = match.group(2) or ""
                  rest = match.group(3)
                  if prefix in PREFIX_MAP:
                      return f"{commit_hash} [{PREFIX_MAP[prefix]}]{scope} {rest}"
              
              return line

          commits_file = sys.argv[1]
          previous_tag = sys.argv[2] if len(sys.argv) > 2 else ""
          current_tag = sys.argv[3] if len(sys.argv) > 3 else ""

          if os.path.exists(commits_file):
              with open(commits_file, "r", encoding="utf-8", errors="ignore") as f:
                  raw_lines = f.read().splitlines()
          else:
              raw_lines = []

          output = ["## What's Changed / 发生了哪些变化？", ""]
          for line in raw_lines:
              if line.strip():
                  output.append(format_commit(line.strip()))

          if previous_tag and current_tag:
              output.extend([
                  "",
                  f"**Full Changelog / 完整更新记录**: https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'Ange-Katrina/Alas-Gyre')}/compare/{previous_tag}...{current_tag}",
              ])
          
          with open("CHANGELOG.md", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(output).rstrip() + "\n")
          PY

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$previous_tag" ]]; then
              git log --oneline "$previous_tag..HEAD" | grep -v "Merge pull request" > full_commits.txt || true
              head -15 full_commits.txt > commits.txt || true
              compare_from="$previous_tag"
            else
              git log --oneline | grep -v "Merge pull request" | head -15 > commits.txt || true
              compare_from=""
            fi
          else
            git log --oneline --since="1 week ago" | grep -v "Merge pull request" | head -15 > commits.txt || true
            compare_from=""
          fi
          python bilingual_changelog.py commits.txt "$compare_from" "${{ steps.set_tag.outputs.tag }}"

      - name: Update version in main.py
        run: |
          tag="${{ steps.set_tag.outputs.tag }}"
          sed -i "s/VERSION = \"v[0-9]\+\.[0-9]\+\.[0-9]\+\"/VERSION = \"$tag\"/g" main.py

      - name: Upload updated code
        uses: actions/upload-artifact@v4
        with:
          name: updated-code
          path: .
          retention-days: 1

  build-pyinstaller:
    name: Build on ${{ matrix.os }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Alas-Gyre-Windows
          - os: macos-latest
            artifact_name: Alas-Gyre-macOS
          - os: ubuntu-latest
            artifact_name: Alas-Gyre-Linux
    steps:
      - name: Download updated code
        uses: actions/download-artifact@v4
        with:
          name: updated-code
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller Alas-Gyre.spec --noconfirm --clean

      - name: Rename Windows exe
        if: matrix.os == 'windows-latest'
        run: |
          mv dist/Alas-Gyre.exe dist/Alas-Gyre-PyInstaller.exe

      - name: Package macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r ../Alas-Gyre-macOS-PyInstaller.zip Alas-Gyre.app Alas-Gyre
          cd ..

      - name: Package Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czf ../Alas-Gyre-Linux-PyInstaller.tar.gz Alas-Gyre
          cd ..

      - name: Upload PyInstaller artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ needs.meta.outputs.tag }}
          path: |
            dist/Alas-Gyre-PyInstaller.exe
            Alas-Gyre-macOS-PyInstaller.zip
            Alas-Gyre-Linux-PyInstaller.tar.gz
          retention-days: 7

  build-nuitka:
    name: Build Nuitka on ${{ matrix.os }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Alas-Gyre-Windows-Nuitka
            output_name: Alas-Gyre-Nuitka.exe
            platform: windows
          - os: macos-latest
            artifact_name: Alas-Gyre-macOS-Nuitka
            output_name: Alas-Gyre-macOS-Nuitka
            platform: macos
          - os: ubuntu-latest
            artifact_name: Alas-Gyre-Linux-Nuitka
            output_name: Alas-Gyre-Linux-Nuitka
            platform: linux
    steps:
      - name: Download updated code
        uses: actions/download-artifact@v4
        with:
          name: updated-code
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set
          pip install -r requirements.txt

      - name: Build with Nuitka
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          OUTPUT_NAME="${{ matrix.output_name }}"

          COMMON_FLAGS=(
            --onefile
            --enable-plugin=pyside6
            --assume-yes-for-downloads
            --lto=yes
            --include-data-dir=ui=ui
            --include-data-files=resources/fastapi_payload.txt=resources/fastapi_payload.txt
            --noinclude-unittest-mode=nofollow
            --remove-output
          )

          if [ "$PLATFORM" = "windows" ]; then
            python -m nuitka \
              "${COMMON_FLAGS[@]}" \
              --windows-console-mode=disable \
              --windows-icon-from-ico=ui/assets/alas.ico \
              --output-filename="${OUTPUT_NAME}" \
              main.py
          elif [ "$PLATFORM" = "macos" ]; then
            python -m nuitka \
              "${COMMON_FLAGS[@]}" \
              --macos-create-app-bundle \
              --output-filename="${OUTPUT_NAME}" \
              main.py
          elif [ "$PLATFORM" = "linux" ]; then
            python -m nuitka \
              "${COMMON_FLAGS[@]}" \
              --output-filename="${OUTPUT_NAME}" \
              main.py
          fi

      - name: Package macOS Nuitka binary
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          if [ -d "${OUTPUT_NAME}.app" ]; then
            zip -r "${OUTPUT_NAME}.zip" "${OUTPUT_NAME}.app" "${OUTPUT_NAME}"
          else
            zip "${OUTPUT_NAME}.zip" "${OUTPUT_NAME}"
          fi
        env:
          OUTPUT_NAME: ${{ matrix.output_name }}

      - name: Package Linux Nuitka binary
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          tar -czf "${OUTPUT_NAME}.tar.gz" "${OUTPUT_NAME}"
        env:
          OUTPUT_NAME: ${{ matrix.output_name }}

      - name: Upload Nuitka artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ needs.meta.outputs.tag }}
          path: |
            ${{ matrix.output_name }}
            ${{ matrix.output_name }}.zip
            ${{ matrix.output_name }}.tar.gz
          retention-days: 7

  release:
    name: Publish Release
    needs: [meta, build-pyinstaller, build-nuitka]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts from GitHub
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Clean up files
        run: |
          mkdir -p release
          find assets/ -name "Alas-Gyre-PyInstaller.exe" -exec cp {} release/ \;
          find assets/ -name "Alas-Gyre-macOS-PyInstaller.zip" -exec cp {} release/ \;
          find assets/ -name "Alas-Gyre-Linux-PyInstaller.tar.gz" -exec cp {} release/ \;
          find assets/ -name "Alas-Gyre-Nuitka.exe" -exec cp {} release/ \;
          find assets/ -name "Alas-Gyre-macOS-Nuitka.zip" -exec cp {} release/ \;
          find assets/ -name "Alas-Gyre-Linux-Nuitka.tar.gz" -exec cp {} release/ \;
          find assets/ -name "CHANGELOG.md" -exec cp {} release/ \;
        shell: bash

      - name: Publish release to GitHub
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: release/CHANGELOG.md
          files: |
            release/Alas-Gyre-PyInstaller.exe
            release/Alas-Gyre-macOS-PyInstaller.zip
            release/Alas-Gyre-Linux-PyInstaller.tar.gz
            release/Alas-Gyre-Nuitka.exe
            release/Alas-Gyre-macOS-Nuitka.zip
            release/Alas-Gyre-Linux-Nuitka.tar.gz
          prerelease: ${{ needs.meta.outputs.prerelease != 'false' }}
