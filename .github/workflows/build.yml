name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # 版本号标记
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  meta:
    name: Gather Meta Information
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      prerelease: ${{ steps.set_pre.outputs.prerelease }}
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag="${{ github.ref_name }}"
          else
            tag=$(git describe --tags --match "v*" HEAD 2>/dev/null || echo "v0.0.1-$(git rev-parse --short HEAD)")
          fi
          echo "tag=${tag}" | tee -a $GITHUB_OUTPUT

      - name: Check if it is a pre-release
        id: set_pre
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ '${{ steps.set_tag.outputs.tag }}' =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" | tee -a $GITHUB_OUTPUT
          else
            echo "prerelease=true" | tee -a $GITHUB_OUTPUT
          fi

      - name: Generate Changelog
        id: generate_changelog
        run: |
          echo "=== Generating Changelog ==="
          cat > bilingual_changelog.py <<'PY'
          import re
          import sys

          PHRASE_MAP = {
              "feat: improve update flow and config display": "功能：改进更新流程和配置显示",
              "fix: improve startup taskbar integration": "修复：改进启动任务栏集成",
              "fix: allow floating widget buttons during click-through": "修复：允许悬浮窗穿透时按钮仍可点击",
              "feat: Implement intelligent failover update download logic: official first, dual-mirror backup fallbacks": "功能：实现智能故障转移更新下载逻辑：官方优先，双镜像备份回退",
              "fix: Increase updater and GUI timeouts and implement high-speed mirror.ghproxy.com download acceleration": "修复：增加更新程序和界面超时时间，并实现 mirror.ghproxy.com 高速下载加速",
          }

          PREFIX_MAP = {
              "feat": "功能",
              "fix": "修复",
              "docs": "文档",
              "style": "样式",
              "refactor": "重构",
              "perf": "性能",
              "test": "测试",
              "build": "构建",
              "ci": "持续集成",
              "chore": "维护",
              "revert": "回滚",
          }

          def translate(message):
              if message in PHRASE_MAP:
                  return PHRASE_MAP[message]
              match = re.match(r"^([a-zA-Z]+)(\(.+?\))?:\s*(.+)$", message)
              if not match:
                  return ""
              prefix = PREFIX_MAP.get(match.group(1).lower())
              if not prefix:
                  return ""
              scope = match.group(2) or ""
              return f"{prefix}{scope}：{match.group(3)}"

          def format_commit(line):
              if not line:
                  return []
              parts = line.split(" ", 1)
              if len(parts) != 2:
                  return [line]
              commit_hash, message = parts
              lines = [line]
              zh = translate(message)
              if zh:
                  lines.append(f"{commit_hash} {zh}")
              return lines

          source = sys.argv[1]
          previous_tag = sys.argv[2] if len(sys.argv) > 2 else ""
          current_tag = sys.argv[3] if len(sys.argv) > 3 else ""

          raw_lines = [line for line in source.splitlines() if line.strip()]
          output = ["## What's Changed / 发生了哪些变化？", ""]
          for raw in raw_lines:
              output.extend(format_commit(raw.strip()))
          if previous_tag and current_tag:
              output.extend([
                  "",
                  f"**Full Changelog / 完整更新记录**: https://github.com/${{ github.repository }}/compare/{previous_tag}...{current_tag}",
              ])
          with open("CHANGELOG.md", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(output).rstrip() + "\n")
          PY

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$previous_tag" ]]; then
              git log --oneline "$previous_tag..HEAD" | grep -v "Merge pull request" > full_commits.txt || true
              total_commits=$(wc -l < full_commits.txt)
              commits="$(head -15 full_commits.txt)"
              compare_from="$previous_tag"
            else
              commits="$(git log --oneline | grep -v "Merge pull request" | head -15 || true)"
              compare_from=""
              total_commits=0
            fi
          else
            commits="$(git log --oneline --since="1 week ago" | grep -v "Merge pull request" | head -15 || true)"
            compare_from=""
            total_commits=0
          fi
          python bilingual_changelog.py "$commits" "$compare_from" "${{ steps.set_tag.outputs.tag }}"

      - name: Update version in main.py
        run: |
          tag="${{ steps.set_tag.outputs.tag }}"
          sed -i "s/VERSION = \"v[0-9]\+\.[0-9]\+\.[0-9]\+\"/VERSION = \"$tag\"/g" main.py

      - name: Upload updated code
        uses: actions/upload-artifact@v4
        with:
          name: updated-code
          path: .
          retention-days: 1

  build-pyinstaller:
    name: Build on ${{ matrix.os }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Alas-Gyre-Windows
          - os: macos-latest
            artifact_name: Alas-Gyre-macOS
          - os: ubuntu-latest
            artifact_name: Alas-Gyre-Linux
    steps:
      - name: Download updated code
        uses: actions/download-artifact@v4
        with:
          name: updated-code
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller Alas-Gyre.spec --noconfirm

      - name: Package macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r ../Alas-Gyre-macOS.zip Alas-Gyre.app Alas-Gyre
          cd ..

      - name: Package Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czf ../Alas-Gyre-Linux.tar.gz Alas-Gyre
          cd ..

      - name: Upload PyInstaller artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ needs.meta.outputs.tag }}
          path: |
            dist/Alas-Gyre.exe
            Alas-Gyre-macOS.zip
            Alas-Gyre-Linux.tar.gz
          retention-days: 7

  release:
    name: Publish Release
    needs: [meta, build-pyinstaller]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts from GitHub
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Clean up files
        run: |
          mkdir -p release
          # Copy Windows exe
          find assets/ -name "Alas-Gyre.exe" -exec cp {} release/ \;
          # Copy macOS zip
          find assets/ -name "Alas-Gyre-macOS.zip" -exec cp {} release/ \;
          # Copy Linux tar.gz
          find assets/ -name "Alas-Gyre-Linux.tar.gz" -exec cp {} release/ \;
          
          # Copy CHANGELOG.md (only for body_path description)
          find assets/ -name "CHANGELOG.md" -exec cp {} release/ \;
        shell: bash

      - name: Publish release to GitHub
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: release/CHANGELOG.md
          files: |
            release/Alas-Gyre.exe
            release/Alas-Gyre-macOS.zip
            release/Alas-Gyre-Linux.tar.gz
          prerelease: ${{ needs.meta.outputs.prerelease != 'false' }}
