name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  meta:
    name: Gather Meta Information
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      prerelease: ${{ steps.set_pre.outputs.prerelease }}
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set tag
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag="${{ github.ref_name }}"
          else
            tag=$(git describe --tags --match "v*" HEAD 2>/dev/null || echo "v0.0.1-$(git rev-parse --short HEAD)")
          fi
          echo "tag=${tag}" | tee -a $GITHUB_OUTPUT

      - name: Check if it is a pre-release
        id: set_pre
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ '${{ steps.set_tag.outputs.tag }}' =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" | tee -a $GITHUB_OUTPUT
          else
            echo "prerelease=true" | tee -a $GITHUB_OUTPUT
          fi

      - name: Generate Changelog
        id: generate_changelog
        run: |
          echo "=== Generating Changelog ==="
          cat > bilingual_changelog.py <<'PY'
          import re
          import sys
          import os
          from collections import OrderedDict

          PREFIX_MAP = {
              "feat": "Features / 新功能",
              "fix": "Fixes / 修复",
              "perf": "Performance / 性能优化",
              "refactor": "Refactors / 重构",
              "docs": "Documentation / 文档",
              "style": "Style / 样式",
              "test": "Tests / 测试",
              "build": "Build / 构建",
              "ci": "CI / 持续集成",
              "chore": "Maintenance / 维护",
              "revert": "Reverts / 回滚",
          }

          CATEGORY_ORDER = [
              "feat",
              "fix",
              "perf",
              "refactor",
              "docs",
              "style",
              "test",
              "build",
              "ci",
              "chore",
              "revert",
              "other",
          ]

          def parse_commit(line):
              if not line:
                  return "", ""
              parts = line.split(" ", 1)
              if len(parts) != 2:
                  return "other", f"- {line}"
              commit_hash, message = parts

              match = re.match(r"^([a-zA-Z]+)(\(.+?\))?(!)?:\s*(.+)$", message)
              if match:
                  prefix = match.group(1).lower()
                  if prefix in PREFIX_MAP:
                      return prefix, f"- {message} ({commit_hash})"

              return "other", f"- {message} ({commit_hash})"

          commits_file = sys.argv[1]
          previous_tag = sys.argv[2] if len(sys.argv) > 2 else ""
          current_tag = sys.argv[3] if len(sys.argv) > 3 else ""

          if os.path.exists(commits_file):
              with open(commits_file, "r", encoding="utf-8", errors="ignore") as f:
                  raw_lines = f.read().splitlines()
          else:
              raw_lines = []

          grouped = OrderedDict((category, []) for category in CATEGORY_ORDER)
          for line in raw_lines:
              if line.strip():
                  category, entry = parse_commit(line.strip())
                  if entry:
                      grouped.setdefault(category, []).append(entry)

          output = ["## What's Changed / 发生了哪些变化？", ""]
          has_entries = any(grouped.get(category) for category in grouped)
          if has_entries:
              for category in grouped:
                  entries = grouped.get(category, [])
                  if not entries:
                      continue
                  title = PREFIX_MAP.get(category, "Other Changes / 其他变化")
                  output.extend([f"### {title}", ""])
                  output.extend(entries)
                  output.append("")
          else:
              output.extend(["- No commit details were found for this release.", ""])

          if previous_tag and current_tag:
              output.extend([
                  f"**Full Changelog / 完整更新记录**: https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'Ange-Katrina/Alas-Gyre')}/compare/{previous_tag}...{current_tag}",
              ])

          with open("CHANGELOG.md", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(output).rstrip() + "\n")
          PY

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$previous_tag" ]]; then
              git log --oneline "$previous_tag..HEAD" | grep -v "Merge pull request" > full_commits.txt || true
              head -15 full_commits.txt > commits.txt || true
              compare_from="$previous_tag"
            else
              git log --oneline | grep -v "Merge pull request" | head -15 > commits.txt || true
              compare_from=""
            fi
          else
            git log --oneline --since="1 week ago" | grep -v "Merge pull request" | head -15 > commits.txt || true
            compare_from=""
          fi
          python bilingual_changelog.py commits.txt "$compare_from" "${{ steps.set_tag.outputs.tag }}"

      - name: Update version in main.py
        env:
          TAG: ${{ steps.set_tag.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("main.py")
          tag = os.environ["TAG"]
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(
              r'VERSION = "v\d+\.\d+\.\d+(?:[-.][A-Za-z0-9._-]+)?"',
              f'VERSION = "{tag}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Failed to update VERSION in main.py")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Upload updated code
        uses: actions/upload-artifact@v7
        with:
          name: updated-code
          path: .
          retention-days: 1

  build-pyinstaller:
    name: Build PyInstaller on Windows
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Download updated code
        uses: actions/download-artifact@v8
        with:
          name: updated-code
          path: .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Configure PyInstaller build flavor
        shell: pwsh
        run: |
          $content = "BUILD_FLAVOR = `"pyinstaller`"`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "build_info.py"), $content, [System.Text.UTF8Encoding]::new($false))

      - name: Install UPX
        shell: pwsh
        run: |
          $version = "5.1.1"
          $url = "https://github.com/upx/upx/releases/download/v$version/upx-$version-win64.zip"
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "tools/upx-$version-win64.zip"
          Expand-Archive -LiteralPath "tools/upx-$version-win64.zip" -DestinationPath tools -Force
          & "tools/upx-$version-win64/upx.exe" --version

      - name: Build with PyInstaller
        run: |
          pyinstaller Alas-Gyre.spec --noconfirm

      - name: Compress PyInstaller exe with UPX
        shell: pwsh
        run: |
          $upx = "tools/upx-5.1.1-win64/upx.exe"
          $exe = "dist/Alas-Gyre.exe"
          if ((Test-Path -LiteralPath $upx) -and (Test-Path -LiteralPath $exe)) {
            & $upx --best --lzma $exe
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "UPX compression failed; keeping original PyInstaller exe."
              exit 0
            }
          }

      - name: Generate PyInstaller sha256
        shell: pwsh
        run: |
          $exe = "dist/Alas-Gyre.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD "dist/Alas-Gyre.exe.sha256"), "$hash  Alas-Gyre.exe`n", [System.Text.Encoding]::ASCII)

      - name: Upload PyInstaller artifact
        uses: actions/upload-artifact@v7
        with:
          name: Alas-Gyre-Windows-PyInstaller-${{ needs.meta.outputs.tag }}
          path: |
            dist/Alas-Gyre.exe
            dist/Alas-Gyre.exe.sha256
          retention-days: 7

  build-nuitka:
    name: Build Nuitka on Windows
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Download updated code
        uses: actions/download-artifact@v8
        with:
          name: updated-code
          path: .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Configure Nuitka build flavor
        shell: pwsh
        run: |
          $content = "BUILD_FLAVOR = `"nuitka`"`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "build_info.py"), $content, [System.Text.UTF8Encoding]::new($false))

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install -r requirements.txt

      - name: Install UPX
        shell: pwsh
        run: |
          $version = "5.1.1"
          $url = "https://github.com/upx/upx/releases/download/v$version/upx-$version-win64.zip"
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "tools/upx-$version-win64.zip"
          Expand-Archive -LiteralPath "tools/upx-$version-win64.zip" -DestinationPath tools -Force
          & "tools/upx-$version-win64/upx.exe" --version

      - name: Build with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --enable-plugin=pyside6 `
            --assume-yes-for-downloads `
            --remove-output `
            --windows-console-mode=disable `
            --windows-icon-from-ico=ui/assets/alas.ico `
            --include-data-files=ui/style.qss=ui/style.qss `
            --include-data-files=ui/light.qss=ui/light.qss `
            --include-data-dir=ui/assets=ui/assets `
            --include-data-files=resources/start_gyre_alas.bat.template=resources/start_gyre_alas.bat.template `
            --include-data-files=resources/start_gyre_alas.sh.template=resources/start_gyre_alas.sh.template `
            --include-data-files=resources/gyre_runtime_updater.py=resources/gyre_runtime_updater.py `
            --include-data-files=overlay/sitecustomize.py=overlay/sitecustomize.py `
            --include-data-files=overlay/gyre_overlay_runtime.py=overlay/gyre_overlay_runtime.py `
            --output-filename=Alas-Gyre-Nuitka.exe `
            main.py

      - name: Compress Nuitka exe with UPX
        shell: pwsh
        run: |
          $upx = "tools/upx-5.1.1-win64/upx.exe"
          if (Test-Path -LiteralPath $upx) {
            & $upx --best --lzma "Alas-Gyre-Nuitka.exe"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "UPX compression failed; keeping original Nuitka exe."
              exit 0
            }
          }

      - name: Generate Nuitka sha256
        shell: pwsh
        run: |
          $exe = "Alas-Gyre-Nuitka.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD "Alas-Gyre-Nuitka.exe.sha256"), "$hash  Alas-Gyre-Nuitka.exe`n", [System.Text.Encoding]::ASCII)

      - name: Upload Nuitka artifact
        uses: actions/upload-artifact@v7
        with:
          name: Alas-Gyre-Windows-Nuitka-${{ needs.meta.outputs.tag }}
          path: |
            Alas-Gyre-Nuitka.exe
            Alas-Gyre-Nuitka.exe.sha256
          retention-days: 7

  release:
    name: Publish Release
    needs: [meta, build-pyinstaller, build-nuitka]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts from GitHub
        uses: actions/download-artifact@v8
        with:
          path: assets

      - name: Clean up files
        run: |
          mkdir -p release
          # Copy Windows exe files
          find assets/ -name "Alas-Gyre.exe" -exec cp {} release/ \;
          find assets/ -name "Alas-Gyre-Nuitka.exe" -exec cp {} release/ \;
          find assets/ -name "Alas-Gyre.exe.sha256" -exec cp {} release/ \;
          find assets/ -name "Alas-Gyre-Nuitka.exe.sha256" -exec cp {} release/ \;

          # Copy CHANGELOG.md (only for body_path description)
          find assets/ -name "CHANGELOG.md" -exec cp {} release/ \;
          ls -la release
        shell: bash

      - name: Publish release to GitHub
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: release/CHANGELOG.md
          files: |
            release/Alas-Gyre.exe
            release/Alas-Gyre.exe.sha256
            release/Alas-Gyre-Nuitka.exe
            release/Alas-Gyre-Nuitka.exe.sha256
          prerelease: ${{ needs.meta.outputs.prerelease != 'false' }}
